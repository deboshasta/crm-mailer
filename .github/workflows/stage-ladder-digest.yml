name: CRM stage & ladder digest

# Every morning, email Simon each pipeline stage, how many deals are in it, and the email ladder
# that stage runs — including the stages that have NO ladder yet, called out explicitly so the gaps
# stay visible. The ladder is read live from send_due.py's CUE table, so this can never drift from
# what actually sends.
#
# 11:30 UTC = 7:30am EDT / 6:30am EST. GitHub crons are UTC and do not follow DST, so this drifts an
# hour in winter — acceptable for a morning digest. Deliberately NOT 11:00 UTC, which is backup.yml's
# backstop slot. This is an owner email, so the 9am-9pm ET client-send window does not apply.

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

concurrency:
  group: crm-stage-ladder-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      DB_PASSWORD:  ${{ secrets.DB_PASSWORD }}
      DB_HOST:      ${{ vars.DB_HOST }}
      DB_USER:      ${{ vars.DB_USER }}
      DB_PORT:      ${{ vars.DB_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Stage & ladder digest
        run: python stage_ladder_digest.py --send
      - name: Alert Simon on failure
        if: failure()
        env:
          FAIL_LABEL: "stage & ladder digest"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_fail.py
